<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医药日报 | 查看</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f8fa;
    color: #24292f;
  }
  .topbar {
    background: #fff; border-bottom: 1px solid #d8dee4;
    padding: 12px 24px; display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 10;
  }
  .topbar a { text-decoration: none; color: #57606a; font-size: 14px; font-weight: 600; }
  .topbar a:hover { color: #c00; }
  .topbar .title { font-size: 15px; font-weight: 800; color: #1f2328; }
  .topbar .spacer { flex: 1; }

  .markdown-body {
    max-width: 920px;
    margin: 30px auto 60px;
    background: #fff;
    border: 1px solid #d8dee4;
    border-radius: 10px;
    padding: 40px 48px;
    line-height: 1.75;
    font-size: 15px;
  }
  /* GitHub 风格 Markdown */
  .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin: 1.2em 0 .5em; font-weight: 800; line-height: 1.3; }
  .markdown-body h1 { font-size: 1.9em; border-bottom: 1px solid #d8dee4; padding-bottom: .3em; }
  .markdown-body h2 { font-size: 1.45em; border-bottom: 1px solid #eaeef2; padding-bottom: .25em; }
  .markdown-body h3 { font-size: 1.15em; }
  .markdown-body p { margin: .6em 0; }
  .markdown-body blockquote {
    border-left: 4px solid #c00; margin: .8em 0; padding: .4em 1em;
    color: #57606a; background: #fff8f8; border-radius: 0 6px 6px 0;
  }
  .markdown-body code {
    background: #f0f1f3; padding: .15em .4em; border-radius: 4px;
    font-size: .9em; font-family: "SFMono-Regular", Consolas, monospace;
  }
  .markdown-body pre {
    background: #f6f8fa; border: 1px solid #d8dee4; border-radius: 8px;
    padding: 14px 16px; overflow-x: auto; margin: .8em 0;
  }
  .markdown-body pre code { background: none; padding: 0; }
  .markdown-body table {
    border-collapse: collapse; width: 100%; margin: .9em 0;
    display: block; overflow-x: auto;
  }
  .markdown-body th, .markdown-body td {
    border: 1px solid #d8dee4; padding: 7px 13px; text-align: left;
    font-size: 14px;
  }
  .markdown-body th { background: #f6f8fa; font-weight: 700; }
  .markdown-body tr:nth-child(2n) td { background: #fafbfc; }
  .markdown-body a { color: #c00; text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body ul, .markdown-body ol { margin: .6em 0 .6em 1.6em; }
  .markdown-body li { margin: .25em 0; }
  .markdown-body hr { border: none; border-top: 1px solid #d8dee4; margin: 1.4em 0; }
  .markdown-body strong { font-weight: 800; }

  .errbox {
    max-width: 920px; margin: 30px auto; background: #fff5f5;
    border: 1px solid #ffd6d6; color: #a30000; border-radius: 10px;
    padding: 20px 28px; font-size: 14px;
  }
  .loading { text-align: center; padding: 80px 0; color: #57606a; font-size: 15px; }

  /* 页内悬浮播放器 */
  #audioBar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 18px; z-index: 99; width: min(680px, 92vw);
    background: #1f2328; color: #fff; border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,.25); padding: 10px 14px;
    display: none; align-items: center; gap: 10px;
  }
  #audioBar .abtn {
    cursor: pointer; width: 38px; height: 38px; border-radius: 50%;
    background: #c00; color: #fff; border: none; font-size: 16px;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  #audioBar .abody { flex: 1; min-width: 0; }
  #audioBar .atitle {
    font-size: 12px; color: #e6e6e6; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;
  }
  #audioBar input[type=range] { width: 100%; accent-color: #ff5c5c; height: 14px; cursor: pointer; }
  #audioBar .atime { font-size: 11px; color: #b0b6bd; margin-top: 2px; }
  #audioBar .aclose {
    cursor: pointer; background: none; border: none; color: #b0b6bd;
    font-size: 18px; flex: none; padding: 4px 6px;
  }
  #audioBar .aclose:hover { color: #fff; }
  /* 语音收听链接样式（🎧 引导行内的 .mp3 链接） */
  .markdown-body a[href$='.mp3'] { font-weight: 700; }
  /* 播放条出现时：正文内联 <audio> 隐藏（避免两个播放器叠放）、页面底部留白 */
  body.hasAudioBar #content audio { display: none; }
  body.hasAudioBar { padding-bottom: 96px; }

  /* 窄屏（手机 / 企微内置浏览器）适配 */
  @media (max-width: 640px) {
    .topbar { padding: 10px 14px; gap: 10px; }
    .topbar .title { font-size: 14px; }
    .markdown-body {
      margin: 12px auto 24px; padding: 20px 16px;
      font-size: 15px; border-radius: 8px; line-height: 1.8;
    }
    .markdown-body h1 { font-size: 1.5em; }
    .markdown-body h2 { font-size: 1.25em; }
    .markdown-body th, .markdown-body td { font-size: 13px; padding: 6px 9px; }
    #audioBar { width: 94vw; bottom: 10px; border-radius: 10px; padding: 9px 12px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html">🏠 返回首页</a>
  <span class="title" id="pageTitle">医药日报</span>
  <div class="spacer"></div>
  <a href="reports/" target="_blank">📂 reports/</a>
</div>

<div id="loading" class="loading">⏳ 加载中…</div>
<div id="errbox" class="errbox" style="display:none"></div>
<article class="markdown-body" id="content" style="display:none"></article>

<div id="audioBar">
  <button class="abtn" id="aPlay">▶</button>
  <div class="abody">
    <div class="atitle" id="aTitle">语音版</div>
    <input type="range" id="aSeek" value="0" min="0" max="1000" step="1">
    <div class="atime"><span id="aCur">0:00</span> / <span id="aDur">--:--</span></div>
  </div>
  <button class="aclose" id="aClose">✕</button>
  <audio id="aAudio" preload="none"></audio>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var file = params.get("file") || "";
  // play=1：进入即装载音频并尝试自动起播（受浏览器自动播放策略限制时，退化为「播放条就绪、点 ▶ 即播」）
  window.__RU_AUTOPLAY = params.get("play") === "1";
  var REPO = "songjen/india-pharma-report";
  var contentEl = document.getElementById("content");
  var errEl = document.getElementById("errbox");
  var loadingEl = document.getElementById("loading");

  if (!file) {
    errEl.style.display = "block";
    errEl.innerHTML = "⚠️ 缺少参数：请在链接后加 <code>?file=日报文件名.md</code><br><a href='reports/' style='color:#c00'>前往 reports/ 目录查看全部日报</a>";
    loadingEl.style.display = "none";
    return;
  }

  // 根据文件名前缀识别国家/语言，显示对应标题
  function detectTitle(fname) {
    var cn = fname.match(/^([\u4e00-\u9fa5]+)医药日报_(\d{8})\.md$/);
    if (cn) return { label: cn[1] + "医药日报", date: cn[2] };
    var ru = fname.match(/^Russia_Pharma_Daily_(\d{8})\.md$/);
    if (ru) return { label: "Russia Pharma Daily", date: ru[1] };
    var br = fname.match(/^Brazil_Pharma_Daily_(\d{8})\.md$/);
    if (br) return { label: "Brazil Pharma Daily", date: br[1] };
    var in_en = fname.match(/^India_Pharma_Daily_(\d{8})\.md$/);
    if (in_en) return { label: "India Pharma Daily", date: in_en[1] };
    var m2 = fname.match(/(\d{8})\.md$/);
    return { label: "医药日报", date: m2 ? m2[1] : "" };
  }

  // 显示日期于标题
  var t = detectTitle(file);
  if (t.date) {
    var d = t.date;
    document.getElementById("pageTitle").textContent =
      t.label + " | " + d.slice(0,4) + "-" + d.slice(4,6) + "-" + d.slice(6,8);
    document.title = t.label + " | " + d.slice(0,4) + "-" + d.slice(4,6) + "-" + d.slice(6,8);
  }

  var RAW = "https://raw.githubusercontent.com/" + REPO + "/main/reports/" + encodeURIComponent(file);

  fetch(RAW)
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(function (text) {
      var html;
      if (typeof marked !== "undefined") {
        html = marked.parse(text);
      } else {
        // marked.js 加载失败：降级为纯文本
        html = "<pre style='white-space:pre-wrap;font-family:inherit'>" +
               text.replace(/&/g,"&amp;").replace(/</g,"&lt;") + "</pre>";
      }
      contentEl.innerHTML = html;
      loadingEl.style.display = "none";
      contentEl.style.display = "block";
      setupAudioLinks();
    })
    .catch(function (e) {
      loadingEl.style.display = "none";
      errEl.style.display = "block";
      errEl.innerHTML = "⚠️ 加载失败：" + e.message + "<br>" +
        "可直接访问原始文件：<a href='" + RAW + "' style='color:#c00'>" + file + "</a>";
    });
})();

// ===== 耳机/音频链接：点击页内直接播放，不跳转 =====
function setupAudioLinks() {
  var bar = document.getElementById("audioBar");
  var audio = document.getElementById("aAudio");
  var btn = document.getElementById("aPlay");
  var seek = document.getElementById("aSeek");
  var curEl = document.getElementById("aCur");
  var durEl = document.getElementById("aDur");
  var titleEl = document.getElementById("aTitle");
  var seeking = false;

  function fmt(s) {
    if (!isFinite(s)) return "--:--";
    s = Math.floor(s);
    return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  }
  function showBar(name) {
    bar.style.display = "flex";
    document.body.classList.add("hasAudioBar");
    titleEl.textContent = "🎧 " + name;
  }
  btn.addEventListener("click", function () {
    if (audio.paused) { audio.play(); } else { audio.pause(); }
  });
  audio.addEventListener("play", function () { btn.textContent = "⏸"; });
  audio.addEventListener("pause", function () { btn.textContent = "▶"; });
  audio.addEventListener("timeupdate", function () {
    if (!seeking && audio.duration) {
      seek.value = Math.round(audio.currentTime / audio.duration * 1000);
    }
    curEl.textContent = fmt(audio.currentTime);
  });
  audio.addEventListener("durationchange", function () {
    durEl.textContent = fmt(audio.duration);
  });
  audio.addEventListener("ended", function () { btn.textContent = "▶"; seek.value = 0; });
  seek.addEventListener("input", function () { seeking = true; });
  seek.addEventListener("change", function () {
    if (audio.duration) audio.currentTime = seek.value / 1000 * audio.duration;
    seeking = false;
  });
  document.getElementById("aClose").addEventListener("click", function () {
    audio.pause(); bar.style.display = "none";
  });

  // 拦截所有指向 .mp3 的链接：阻止跳转，改为页内播放
  document.getElementById("content").addEventListener("click", function (ev) {
    var a = ev.target.closest && ev.target.closest("a[href]");
    if (!a) return;
    var href = a.getAttribute("href") || "";
    if (!/\.mp3(\?|$)/i.test(href)) return;
    ev.preventDefault();
    if (audio.src !== a.href) { audio.src = a.href; }
    showBar(a.textContent.replace(/^[^\w\u4e00-\u9fa5]+/, "") || "语音版");
    audio.play();
  });
}
</script>
</body>
</html>
